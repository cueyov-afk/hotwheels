<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feliz Día de los Hot Wheels</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         PANTALLA INICIAL
    ========================== -->

    <section class="intro">

        <div class="intro-content">

            <h1>
                FELIZ DÍA DE LOS
                <span>HOT WHEELS</span>
                <span>SURICATO</span>
            </h1>

            <p class="message">
                Acelera para encender el motor y descubrir tu sorpresa.
            </p>

            <button class="intro-btn" type="button">
                🔑 INICIAR MOTOR
            </button>

        </div>

    </section>


    <!-- =========================
         ESCENA DE CARRERA
    ========================== -->

    <section class="race">

        <div class="speed-lines"></div>

        <div class="race-text">
            ¡MOTOR ENCENDIDO!
        </div>

        <div class="race-car"></div>

    </section>


    <!-- =========================
         SORPRESA FINAL
    ========================== -->

    <section class="surprise">

        <div class="particles"></div>

        <div class="butterflies"></div>

        <div class="flowers"></div>

        <div class="cars"></div>


        <div class="surprise-content">

            <div class="final-line"></div>

            <h2>
                ¡FELIZ DÍA MI NIÑO BELLO SIN DUDA TE LO MERECES!
            </h2>

            <h3>
                Suricato, te amo con todo mi corazón y espero que te guste.
            </h3>

            <p>
                Esta sorpresa es para vos.
            </p>

            <div class="final-glow">
                ✦
            </div>

        </div>

    </section>


    <!-- =========================
         PANTALLAS SECRETAS
    ========================== -->

    <div class="secret-screen" id="secretScreen">

        <div class="secret-content">

            <div class="secret-number"></div>

            <p class="secret-message"></p>

            <span class="secret-hint">
                Tocá la pantalla para volver
            </span>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
